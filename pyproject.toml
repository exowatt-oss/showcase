[project]
name = "showcase"
version = "0.1.0"
description = "Self-hosted HTML pages and versioned deck bundles"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.50.2",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "jinja2>=3.1.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "python-multipart>=0.0.20",
    "httpx>=0.28.1",
    "forwarded-auth[fastapi] @ git+https://github.com/exowatt-oss/forwarded-auth@2a3463c4ed4da46591f4c0ec930bb3483e12dafd",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
